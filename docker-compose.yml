version: "3.9"

# =============================================================================
# docker-compose.yml — Zero-Knowledge File Storage — Local Development Stack
# =============================================================================
# Services:
#   postgres  — PostgreSQL 16 database
#   minio     — MinIO object storage (S3-compatible)
#   minio-mc  — One-shot MinIO Client for bucket/policy bootstrap
# =============================================================================

services:

  # ── PostgreSQL 16 ─────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: zkfs-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB:       zkfs_db
      POSTGRES_USER:     zkfs_user
      POSTGRES_PASSWORD: changeme
      PGDATA:            /var/lib/postgresql/data/pgdata
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zkfs_user -d zkfs_db"]
      interval: 10s
      timeout:  5s
      retries:  5

  # ── MinIO Object Storage ───────────────────────────────────────────────────
  minio:
    image: minio/minio:latest
    container_name: zkfs-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER:     minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # Web Console  → http://localhost:9001
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout:  10s
      retries:  3

  # ── MinIO Client Bootstrap ─────────────────────────────────────────────────
  # Creates buckets and sets policies on first startup.
  # Runs once and exits; depends_on ensures MinIO is healthy first.
  minio-mc:
    image: minio/mc:latest
    container_name: zkfs-minio-mc
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
        mc alias set local http://minio:9000 minioadmin minioadmin &&
        mc mb --ignore-existing local/zk-chunks &&
        mc mb --ignore-existing local/zk-temp &&
        mc anonymous set none local/zk-chunks &&
        mc anonymous set none local/zk-temp &&
        echo 'MinIO bootstrap complete'
      "

volumes:
  postgres_data:
  minio_data:
