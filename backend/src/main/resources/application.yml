# =============================================================================
# application.yml — Zero-Knowledge File Storage Backend
# =============================================================================
# Environment variables are injected at runtime.
# Defaults provided for local Docker-Compose development.
# NEVER commit real secrets to source control.
# =============================================================================

spring:
  application:
    name: zk-file-storage

  # ── PostgreSQL / JPA ────────────────────────────────────────────────────────
  datasource:
    url:      jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:zkfs_db}
    username: ${DB_USERNAME:zkfs_user}
    password: ${DB_PASSWORD:changeme}
    driver-class-name: org.postgresql.Driver
    hikari:
      pool-name:              ZKFSHikariPool
      maximum-pool-size:      20
      minimum-idle:           5
      connection-timeout:     30000   # 30 s
      idle-timeout:           600000  # 10 min
      max-lifetime:           1800000 # 30 min
      leak-detection-threshold: 60000

  jpa:
    hibernate:
      ddl-auto: validate            # Flyway owns schema; Hibernate only validates
    show-sql: ${SHOW_SQL:false}
    open-in-view: false             # Prevent lazy-loading anti-pattern
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        jdbc:
          lob.non_contextual_creation: true
          time_zone: UTC

  # ── Flyway Migrations ───────────────────────────────────────────────────────
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false
    validate-on-migrate: true
    out-of-order: false

  # ── Servlet / Multipart ─────────────────────────────────────────────────────
  servlet:
    multipart:
      enabled: true
      max-file-size:    512MB
      max-request-size: 512MB

# ── Server ───────────────────────────────────────────────────────────────────
server:
  port: ${SERVER_PORT:8080}
  servlet:
    context-path: /api
  compression:
    enabled: true
    mime-types: application/json,application/xml,text/plain,text/xml,text/html
  error:
    include-message: always          # Expose error messages (disable in prod)
    include-binding-errors: always

# ── JWT Configuration ────────────────────────────────────────────────────────
jwt:
  # Generate with: openssl rand -base64 64
  # MUST be at least 512 bits (64 bytes) for HS512
  secret: ${JWT_SECRET:CHANGE_ME_IN_PRODUCTION_USE_A_512BIT_BASE64_SECRET_KEY_HERE_MINIMUM_64_CHARS}
  access-token-expiry-ms:  ${JWT_ACCESS_EXPIRY_MS:900000}        # 15 minutes
  refresh-token-expiry-ms: ${JWT_REFRESH_EXPIRY_MS:604800000}    # 7 days
  issuer: zk-file-storage

# ── MinIO / S3 Object Storage ────────────────────────────────────────────────
minio:
  endpoint:   ${MINIO_ENDPOINT:http://localhost:9000}
  access-key: ${MINIO_ACCESS_KEY:minioadmin}
  secret-key: ${MINIO_SECRET_KEY:minioadmin}
  bucket:
    chunks:     ${MINIO_BUCKET_CHUNKS:zk-chunks}      # Encrypted file chunks
    temp:       ${MINIO_BUCKET_TEMP:zk-temp}          # Temporary upload staging
  region:     ${MINIO_REGION:us-east-1}
  # Presigned URL TTL for chunk downloads (seconds)
  presigned-url-expiry: ${MINIO_PRESIGNED_EXPIRY:3600}

# ── CORS ─────────────────────────────────────────────────────────────────────
cors:
  allowed-origins: http://localhost:3000,http://localhost:3001,${CORS_EXTRA_ORIGIN:}           # Add staging/prod URL via env var

# ── Actuator ─────────────────────────────────────────────────────────────────
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when_authorized

# ── Logging ──────────────────────────────────────────────────────────────────
logging:
  level:
    root:                           INFO
    com.iitjammu:                   DEBUG
    org.springframework.security:   INFO
    org.hibernate.SQL:              ${SHOW_SQL:false}
    io.minio:                       WARN
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"

---
# ── Profile: test ─────────────────────────────────────────────────────────────
spring:
  config:
    activate:
      on-profile: test
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password:
  flyway:
    enabled: false
  jpa:
    hibernate:
      ddl-auto: create-drop
